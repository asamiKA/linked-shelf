<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>書架デザイン確認</title>
    <link rel="stylesheet" href="./src/style.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-color: #15191b;
            color: #f0e6d2;
            font-family: sans-serif;
            overflow-x: hidden;
        }

        .preview-shelf-list {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            box-sizing: border-box;
            padding: 0 16px;
        }

        .scene {
            position: relative;
            width: calc(100vw - 32px);
            height: 198px;
            background:
                linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px) 0 0 / 48px 100%,
                linear-gradient(180deg, #3d4549, #252b2e 75%, #1c2225);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.45);
            box-sizing: border-box;
        }

        .scene::before,
        .scene::after {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            width: 24px;
            background: linear-gradient(90deg, #9aa5a9, #566268 32%, #313b40 68%, #778287);
            box-shadow:
                inset 2px 0 rgba(255, 255, 255, 0.24),
                inset -3px 0 rgba(0, 0, 0, 0.48);
            z-index: 3;
        }

        .scene::before {
            left: 0;
        }

        .scene::after {
            right: 0;
        }

        .spine-container {
            position: absolute;
            right: 28px;
            bottom: 18px;
            left: 28px;
            display: flex;
            gap: 8px;
            align-items: flex-end;
            height: 180px;
            overflow-x: auto;
        }

        .spine {
            display: flex;
            flex: 0 0 auto;
            align-items: center;
            justify-content: center;
        }

        .shelf-board {
            position: absolute;
            right: 24px;
            bottom: 0;
            left: 24px;
            z-index: 2;
            cursor: default;
        }
    </style>
</head>
<body>
    <main class="preview-shelf-list" id="previewShelfList"></main>
    <script type="module">
        import { getBookDesign } from './src/book-design.js';
        import { mc21PreviewBooks } from './src/mc21-preview-books.js';

        const shelfList = document.getElementById('previewShelfList');
        let resizeTimer;

        function getBookCount() {
            return Math.max(10, Math.min(50, Math.floor((shelfList.clientWidth - 72) / 40)));
        }

        function getTitleLayout(title, bookHeight) {
            const characters = Array.from(title);
            const availableHeight = bookHeight - 18;
            const minimumFontSize = 9;
            const fontSize = Math.max(
                minimumFontSize,
                Math.min(12, Math.floor(availableHeight / (characters.length * (4 / 3))))
            );
            const maximumCharacters = Math.floor(availableHeight / (minimumFontSize * (4 / 3)));
            const displayTitle = characters.length > maximumCharacters
                ? `${characters.slice(0, maximumCharacters - 3).join('')}...`
                : title;

            return { displayTitle, fontSize };
        }

        function createShelf(books, shelfIndex) {
            const scene = document.createElement('section');
            scene.className = 'scene';
            scene.setAttribute('aria-label', `NDLC MC21 デザイン確認棚 ${shelfIndex + 1}`);

            const spineContainer = document.createElement('div');
            spineContainer.className = 'spine-container';
            books.forEach(book => {
                const spine = document.createElement('div');
                spine.className = 'spine book-spine';
                const design = getBookDesign(book);
                spine.style.setProperty('--book-color', design.color);
                spine.style.setProperty('--book-height', `${design.height}px`);

                const title = document.createElement('span');
                title.className = 'book-title';
                const { displayTitle, fontSize } = getTitleLayout(book.title, design.height);
                title.setAttribute('aria-label', book.title);
                title.style.setProperty('--title-size', `${fontSize}pt`);
                title.textContent = displayTitle;
                spine.appendChild(title);
                spineContainer.appendChild(spine);
            });

            const shelfBoard = document.createElement('div');
            shelfBoard.className = 'shelf-board';
            shelfBoard.setAttribute('aria-hidden', 'true');
            const shelfLabel = document.createElement('span');
            shelfLabel.className = 'shelf-label';
            shelfLabel.textContent = `NDLC: MC21 · 棚 ${String(shelfIndex + 1).padStart(3, '0')}`;
            shelfBoard.appendChild(shelfLabel);

            scene.append(spineContainer, shelfBoard);
            return scene;
        }

        function renderPreview() {
            const count = getBookCount();
            const shelves = [];
            for (let index = 0; index < mc21PreviewBooks.length; index += count) {
                shelves.push(createShelf(mc21PreviewBooks.slice(index, index + count), shelves.length));
            }
            shelfList.replaceChildren(...shelves);
        }

        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(renderPreview, 300);
        });

        requestAnimationFrame(renderPreview);
    </script>
</body>
</html>
