<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>書架デザイン確認</title>
    <link rel="stylesheet" href="./src/style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #15191b;
            color: #f0e6d2;
            font-family: sans-serif;
            display: grid;
            place-items: center;
        }

        .scene {
            position: relative;
            width: min(600px, calc(100vw - 32px));
            height: 350px;
            background:
                radial-gradient(ellipse 2px 3px at 7px 18px, #30373a 0 1px, transparent 2px) left top / 15px 36px repeat-y,
                radial-gradient(ellipse 2px 3px at 7px 18px, #30373a 0 1px, transparent 2px) right top / 15px 36px repeat-y,
                linear-gradient(90deg, #737c80 0 15px, #353c40 15px 20px, transparent 20px calc(100% - 20px), #353c40 calc(100% - 20px) calc(100% - 15px), #737c80 calc(100% - 15px)),
                linear-gradient(180deg, #3d4549, #252b2e 75%, #1c2225);
            border: 4px solid #7b858a;
            border-radius: 4px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 0 0 2px #41494d;
            box-sizing: border-box;
        }

        .shelf-title {
            position: absolute;
            top: 15px;
            left: 20px;
            color: #d2d9db;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .spine-container {
            position: absolute;
            right: 20px;
            bottom: 58px;
            left: 20px;
            display: flex;
            gap: 8px;
            align-items: flex-end;
            height: 220px;
            overflow-x: auto;
        }

        .spine {
            display: flex;
            flex: 0 0 auto;
            align-items: center;
            justify-content: center;
        }

        .shelf-board {
            position: absolute;
            right: 20px;
            bottom: 40px;
            left: 20px;
            z-index: 2;
        }
    </style>
</head>
<body>
    <main class="scene" aria-label="書架デザイン確認">
        <div class="shelf-title">書架デザイン確認</div>
        <div class="spine-container">
            <div class="spine book-spine" style="--book-color: #191970"><span class="book-title">量子力学入門</span></div>
            <div class="spine book-spine" style="--book-color: #8b0000"><span class="book-title">相対性理論概説</span></div>
            <div class="spine book-spine" style="--book-color: #556b2f"><span class="book-title">統計力学の基礎</span></div>
            <div class="spine book-spine" style="--book-color: #2f4f4f"><span class="book-title">宇宙論の現在</span></div>
            <div class="spine book-spine" style="--book-color: #8b4513"><span class="book-title">恒星進化論</span></div>
            <div class="spine book-spine" style="--book-color: #483d8b"><span class="book-title">ブラックホール物理</span></div>
            <div class="spine book-spine" style="--book-color: #006666"><span class="book-title">アルゴリズムとデータ構造</span></div>
            <div class="spine book-spine" style="--book-color: #663399"><span class="book-title">人工知能の歴史</span></div>
            <div class="spine book-spine" style="--book-color: #993333"><span class="book-title">計算機アーキテクチャ</span></div>
            <div class="spine book-spine" style="--book-color: #333366"><span class="book-title">線型代数特論</span></div>
            <div class="spine book-spine" style="--book-color: #663333"><span class="book-title">位相空間論</span></div>
            <div class="spine book-spine" style="--book-color: #336633"><span class="book-title">数理統計学入門</span></div>
        </div>
        <div class="shelf-board" aria-hidden="true"></div>
    </main>
    <script>
        function getBookHeight(title) {
            return 136 + Array.from(title).reduce((hash, character) => (
                (hash * 31 + character.codePointAt(0)) >>> 0
            ), 0) % 49;
        }

        function getTitleLayout(title, bookHeight) {
            const characters = Array.from(title);
            const availableHeight = bookHeight - 18;
            const minimumFontSize = 9;
            const fontSize = Math.max(
                minimumFontSize,
                Math.min(12, Math.floor(availableHeight / (characters.length * (4 / 3))))
            );
            const maximumCharacters = Math.floor(availableHeight / (minimumFontSize * (4 / 3)));
            const displayTitle = characters.length > maximumCharacters
                ? `${characters.slice(0, maximumCharacters - 3).join('')}...`
                : title;

            return { displayTitle, fontSize };
        }

        document.querySelectorAll('.book-spine').forEach(spine => {
            const title = spine.querySelector('.book-title');
            const fullTitle = title.textContent;
            const bookHeight = getBookHeight(fullTitle);
            const { displayTitle, fontSize } = getTitleLayout(fullTitle, bookHeight);

            spine.style.setProperty('--book-height', `${bookHeight}px`);
            title.setAttribute('aria-label', fullTitle);
            title.style.setProperty('--title-size', `${fontSize}pt`);
            title.textContent = displayTitle;
        });
    </script>
</body>
</html>
