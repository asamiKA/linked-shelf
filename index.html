<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookshelf Graph Navigator</title>
    <link rel="stylesheet" href="./src/style.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-color: #15191b;
            color: #f0e6d2;
            font-family: sans-serif;
            overflow-x: hidden;
        }

        .shelf-list {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            box-sizing: border-box;
            padding: 0 16px 96px;
        }

        .scene {
            position: relative;
            width: calc(100vw - 32px);
            height: 198px;
            background:
                linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px) 0 0 / 48px 100%,
                linear-gradient(180deg, #3d4549, #252b2e 75%, #1c2225);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.45);
            box-sizing: border-box;
        }

        .scene::before,
        .scene::after {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            width: 24px;
            background:
                linear-gradient(90deg, #9aa5a9, #566268 32%, #313b40 68%, #778287);
            box-shadow:
                inset 2px 0 rgba(255, 255, 255, 0.24),
                inset -3px 0 rgba(0, 0, 0, 0.48);
            z-index: 3;
        }

        .scene::before {
            left: 0;
        }

        .scene::after {
            right: 0;
        }

        .shelf-title {
            display: none;
        }

        .debug-info {
            display: none;
        }

        .scene.show-debug .debug-info {
            display: block;
            position: absolute;
            top: 8px;
            left: 32px;
            right: 32px;
            max-height: 120px;
            overflow: auto;
            padding: 8px;
            background: rgba(15, 19, 21, 0.94);
            color: #d2d9db;
            font-size: 10px;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
            z-index: 4;
        }

        .shelf-board {
            position: absolute;
            right: 24px;
            bottom: 0;
            left: 24px;
            z-index: 2;
        }

        .shelf-nav {
            position: absolute;
            top: 0;
            bottom: 0;
            z-index: 4;
            width: 24px;
            padding: 0;
            border: 0;
            background: transparent;
            cursor: pointer;
        }

        .shelf-nav--left {
            left: 0;
        }

        .shelf-nav--right {
            right: 0;
        }

        .spine-container {
            position: absolute;
            right: 28px;
            bottom: 18px;
            left: 28px;
            display: flex;
            gap: 8px;
            align-items: flex-end;
            height: 180px;
            padding-bottom: 0;
            z-index: 2;
            overflow-x: auto;
        }

        .spine {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading-status {
            margin: 0;
            color: #aeb7ba;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <main class="shelf-list" id="shelfList" aria-live="polite"></main>
    <p class="loading-status" id="loadingStatus">棚を読み込み中...</p>

    <script type="module">
        import { fetchShelfBySru } from './src/api.js';
        import { getBookDesign } from './src/book-design.js';
        import {
            buildLastViewedShelfPath,
            buildSearchPath,
            completeSearchPath,
            getNextNdlcCode,
            isRootSearchPath,
            parseSearchRoute
        } from './src/search-route.js';

        try {
            const recoveredPath = sessionStorage.getItem('linked-shelf-route');
            if (recoveredPath) {
                sessionStorage.removeItem('linked-shelf-route');
                const recoveredUrl = new URL(recoveredPath, window.location.origin);
                if (recoveredUrl.origin === window.location.origin) {
                    window.history.replaceState(null, '', recoveredUrl.pathname);
                }
            }
        } catch {
        }

        const MAX_SHELVES = 200;
        const SHELF_HEIGHT = 198;
        const SHELF_GAP = 0;
        const MINIMUM_RENDER_INTERVAL_MS = 1000;
        let searchRoute = parseSearchRoute(window.location.pathname);
        const LAST_VIEWED_SHELF_KEY = 'linked-shelf-last-viewed-route';
        if (isRootSearchPath(window.location.pathname, searchRoute)) {
            try {
                const lastViewedPath = localStorage.getItem(LAST_VIEWED_SHELF_KEY);
                if (lastViewedPath) {
                    const lastViewedUrl = new URL(lastViewedPath, window.location.origin);
                    const lastViewedRoute = parseSearchRoute(lastViewedUrl.pathname);
                    if (
                        lastViewedUrl.origin === window.location.origin &&
                        lastViewedRoute.basePath === searchRoute.basePath &&
                        !isRootSearchPath(lastViewedUrl.pathname, lastViewedRoute)
                    ) {
                        window.history.replaceState(null, '', lastViewedUrl.pathname);
                        searchRoute = lastViewedRoute;
                    }
                }
            } catch {
            }
        }

        function parseCurrentSearchRoute() {
            const completedPath = completeSearchPath(window.location.pathname);
            if (completedPath !== window.location.pathname) {
                window.history.replaceState(null, '', completedPath);
            }
            return parseSearchRoute(completedPath);
        }

        searchRoute = parseCurrentSearchRoute();
        const searchParams = { ...searchRoute.params };
        let currentUrlYear = searchParams.fromYear;
        const shelfList = document.getElementById('shelfList');
        const loadingStatus = document.getElementById('loadingStatus');

        let nextStartRecord = searchParams.startRecord;
        let renderedShelfCount = 0;
        let lastRenderedAt = 0;
        let isLoadingShelf = false;
        let hasMoreShelves = true;
        let prefetchPromise = null;
        let shelfGeneration = 0;
        let scrollTimer;
        let resizeTimer;

        function getResponsiveRecordCount() {
            const availableWidth = (window.visualViewport?.width || window.innerWidth) - 72;
            return Math.max(10, Math.min(50, Math.floor(availableWidth / 40)));
        }

        function getTitleLayout(title, bookHeight) {
            const characters = Array.from(title);
            const availableHeight = bookHeight - 18;
            const minimumFontSize = 9;
            const fontSize = Math.max(
                minimumFontSize,
                Math.min(12, Math.floor(availableHeight / (characters.length * (4 / 3))))
            );
            const maximumCharacters = Math.floor(availableHeight / (minimumFontSize * (4 / 3)));
            const displayTitle = characters.length > maximumCharacters
                ? `${characters.slice(0, maximumCharacters - 3).join('')}...`
                : title;

            return { displayTitle, fontSize };
        }

        function createShelfElement(node, shelfNumber) {
            const scene = document.createElement('section');
            scene.className = 'scene';
            scene.setAttribute('aria-label', `NDLC ${searchParams.ndlc} の棚 ${shelfNumber}`);
            scene.dataset.leftmostPublicationYear = node.books[0]?.publicationYear ?? '';

            const title = document.createElement('div');
            title.className = 'shelf-title';
            title.textContent = `NDLC: ${searchParams.ndlc} — 棚 ${shelfNumber}`;

            const debug = document.createElement('div');
            debug.className = 'debug-info';
            const timing = node.debug.timing;
            const debugLines = [
                `開始レコード: ${node.debug.startRecord}`,
                `表示冊数: ${node.books.length}`,
                `NDL API通信: ${node.debug.responseTimeMs} ms${node.debug.cached ? '（キャッシュ再利用）' : ''}`,
                `先読み待機: ${timing.prefetchWaitMs} ms`,
                `データ準備: ${timing.dataPreparationMs} ms`,
                `描画間隔待機: ${timing.renderIntervalWaitMs} ms`,
                `キャッシュ: ${node.debug.cached ? `${node.debug.cachedRecordCount}件を再利用` : 'NDL APIから取得'}`,
                `棚ハッシュ: ${node.id}`
            ];
            if (!node.debug.cached && node.debug.cqlQuery) {
                debugLines.push(
                    `CQL（デコード済み）:\n${node.debug.cqlQuery}`
                );
            }
            debug.textContent = debugLines.join('\n');

            const spineContainer = document.createElement('div');
            spineContainer.className = 'spine-container';
            node.books.forEach(book => {
                const spine = document.createElement('div');
                spine.className = 'spine book-spine';
                const design = getBookDesign(book);
                spine.style.setProperty('--book-color', design.color);
                spine.style.setProperty('--book-height', `${design.height}px`);
                spine.title = book.title;
                spine.addEventListener('click', () => alert(`「${book.title}」が選択されました`));

                const bookTitle = document.createElement('span');
                bookTitle.className = 'book-title';
                const { displayTitle, fontSize } = getTitleLayout(book.title, design.height);
                bookTitle.setAttribute('aria-label', book.title);
                bookTitle.style.setProperty('--title-size', `${fontSize}pt`);
                bookTitle.textContent = displayTitle;
                spine.appendChild(bookTitle);
                spineContainer.appendChild(spine);
            });

            const shelfBoard = document.createElement('button');
            const debugId = `debugInfo-${shelfNumber}`;
            shelfBoard.className = 'shelf-board';
            shelfBoard.type = 'button';
            shelfBoard.setAttribute('aria-controls', debugId);
            shelfBoard.setAttribute('aria-expanded', 'false');
            shelfBoard.setAttribute('aria-label', `棚 ${shelfNumber} のデバッグ情報を表示`);
            shelfBoard.addEventListener('click', () => {
                const isExpanded = scene.classList.toggle('show-debug');
                shelfBoard.setAttribute('aria-expanded', String(isExpanded));
            });
            const shelfLabel = document.createElement('span');
            shelfLabel.className = 'shelf-label';
            shelfLabel.textContent = `NDLC: ${searchParams.ndlc} · 棚 ${String(shelfNumber).padStart(3, '0')}`;
            shelfBoard.appendChild(shelfLabel);
            debug.id = debugId;

            const nextNdlcCode = getNextNdlcCode(searchParams.ndlc);
            const navigationButtons = ['left', 'right'].map(side => {
                const button = document.createElement('button');
                button.className = `shelf-nav shelf-nav--${side}`;
                button.type = 'button';
                button.setAttribute('aria-label', `NDLC ${nextNdlcCode} の書架を表示`);
                button.addEventListener('click', advanceToNextNdlc);
                return button;
            });

            scene.append(title, debug, spineContainer, shelfBoard, ...navigationButtons);
            return scene;
        }

        function rememberVisibleShelf() {
            let visibleShelf = null;
            let maximumVisibleHeight = 0;
            for (const scene of shelfList.children) {
                const bounds = scene.getBoundingClientRect();
                const visibleHeight = Math.max(
                    0,
                    Math.min(bounds.bottom, window.innerHeight) - Math.max(bounds.top, 0)
                );
                if (visibleHeight > maximumVisibleHeight) {
                    visibleShelf = scene;
                    maximumVisibleHeight = visibleHeight;
                }
            }
            if (!visibleShelf) return;

            const resumePath = buildLastViewedShelfPath(
                searchRoute.basePath,
                searchParams.ndlc,
                { publicationYear: Number(visibleShelf.dataset.leftmostPublicationYear) }
            );
            if (!resumePath) return;
            try {
                localStorage.setItem(LAST_VIEWED_SHELF_KEY, resumePath);
            } catch {
            }
        }

        function wait(milliseconds) {
            return new Promise(resolve => setTimeout(resolve, milliseconds));
        }

        function updateStatus() {
            if (renderedShelfCount >= MAX_SHELVES) {
                loadingStatus.textContent = `表示上限の${MAX_SHELVES}棚に達しました`;
            } else if (!hasMoreShelves) {
                loadingStatus.textContent = 'これ以上の棚はありません';
            } else if (isLoadingShelf) {
                loadingStatus.textContent = '次の棚を読み込み中...';
            } else {
                loadingStatus.textContent = 'スクロールに応じて次の棚を読み込みます';
            }
        }

        function updateSearchPathFromTopShelf() {
            const topShelf = Array.from(shelfList.children).find(
                scene => scene.getBoundingClientRect().bottom > 0
            );
            const year = Number(topShelf?.dataset.leftmostPublicationYear);
            if (!Number.isSafeInteger(year) || year < 1000 || year === currentUrlYear) return;

            currentUrlYear = year;
            window.history.replaceState(
                null,
                '',
                buildSearchPath(searchRoute.basePath, { ...searchParams, fromYear: year })
            );
        }

        async function appendNextShelf() {
            if (isLoadingShelf || !hasMoreShelves || renderedShelfCount >= MAX_SHELVES) {
                return false;
            }

            const generation = shelfGeneration;
            isLoadingShelf = true;
            updateStatus();
            try {
                const preparationStartedAt = performance.now();
                let prefetchWaitMs = 0;
                if (prefetchPromise) {
                    const prefetchWaitStartedAt = performance.now();
                    await prefetchPromise;
                    prefetchWaitMs = Math.round(performance.now() - prefetchWaitStartedAt);
                }
                if (generation !== shelfGeneration) return false;

                const count = getResponsiveRecordCount();
                const node = await fetchShelfBySru({
                    ...searchParams,
                    startRecord: nextStartRecord,
                    cnt: count,
                    prefetch: true
                });
                if (generation !== shelfGeneration) return false;
                if (node.id === 'error-node' || node.books.length === 0) {
                    hasMoreShelves = false;
                    return false;
                }

                const remainingDelay = node.debug.cached ? 0 : Math.max(
                    0,
                    MINIMUM_RENDER_INTERVAL_MS - (Date.now() - lastRenderedAt)
                );
                if (lastRenderedAt && remainingDelay) await wait(remainingDelay);
                if (generation !== shelfGeneration) return false;

                node.debug.timing = {
                    prefetchWaitMs,
                    dataPreparationMs: Math.round(performance.now() - preparationStartedAt - remainingDelay),
                    renderIntervalWaitMs: remainingDelay
                };
                shelfList.appendChild(createShelfElement(node, renderedShelfCount + 1));
                updateSearchPathFromTopShelf();
                renderedShelfCount += 1;
                lastRenderedAt = Date.now();
                nextStartRecord = node.debug.endRecord + 1;
                rememberVisibleShelf();
                return true;
            } finally {
                if (generation === shelfGeneration) {
                    isLoadingShelf = false;
                    updateStatus();
                }
            }
        }

        function getShelvesPerViewport() {
            return Math.ceil(window.innerHeight / (SHELF_HEIGHT + SHELF_GAP));
        }

        async function prefetchShelves(shelfCount) {
            if (prefetchPromise || !hasMoreShelves || renderedShelfCount >= MAX_SHELVES) {
                return prefetchPromise;
            }

            const generation = shelfGeneration;
            const count = getResponsiveRecordCount() * shelfCount;
            prefetchPromise = fetchShelfBySru({
                ...searchParams,
                startRecord: nextStartRecord,
                cnt: count,
                prefetch: true
            }).catch(error => {
                console.error('Failed to prefetch shelves:', error);
            }).finally(() => {
                if (generation === shelfGeneration) prefetchPromise = null;
            });
            return prefetchPromise;
        }

        function resetSearch(route) {
            searchRoute = route;
            Object.assign(searchParams, route.params);
            currentUrlYear = searchParams.fromYear;
            shelfGeneration += 1;
            nextStartRecord = searchParams.startRecord;
            renderedShelfCount = 0;
            lastRenderedAt = 0;
            isLoadingShelf = false;
            hasMoreShelves = true;
            prefetchPromise = null;
            shelfList.replaceChildren();
            updateStatus();
            void renderInitialShelves(shelfGeneration);
        }

        function advanceToNextNdlc() {
            const route = {
                basePath: searchRoute.basePath,
                params: {
                    ...searchParams,
                    fromYear: currentUrlYear,
                    ndlc: getNextNdlcCode(searchParams.ndlc)
                }
            };
            window.history.pushState(null, '', buildSearchPath(route.basePath, route.params));
            resetSearch(route);
        }

        window.addEventListener('popstate', () => {
            resetSearch(parseCurrentSearchRoute());
        });

        function prefetchNextViewport() {
            return prefetchShelves(getShelvesPerViewport());
        }

        async function renderInitialShelves(generation = shelfGeneration) {
            const firstShelfAppended = await appendNextShelf();
            if (generation !== shelfGeneration) return;
            if (firstShelfAppended) {
                const initialShelfCount = Math.ceil(
                    (window.innerHeight * 2) / (SHELF_HEIGHT + SHELF_GAP)
                );
                void prefetchShelves(
                    initialShelfCount - 1 + getShelvesPerViewport()
                );
            }

            while (
                generation === shelfGeneration &&
                hasMoreShelves &&
                renderedShelfCount < MAX_SHELVES &&
                shelfList.scrollHeight < window.innerHeight * 2
            ) {
                const appended = await appendNextShelf();
                if (!appended) break;
            }
        }

        async function ensureScrollBuffer() {
            const generation = shelfGeneration;
            const remainingHeight = document.documentElement.scrollHeight - (window.scrollY + window.innerHeight);
            if (remainingHeight > window.innerHeight || isLoadingShelf) return;

            while (
                generation === shelfGeneration &&
                hasMoreShelves &&
                renderedShelfCount < MAX_SHELVES &&
                document.documentElement.scrollHeight - (window.scrollY + window.innerHeight) <= window.innerHeight
            ) {
                const appended = await appendNextShelf();
                if (!appended) break;
            }
            void prefetchNextViewport();
        }

        window.addEventListener('scroll', () => {
            clearTimeout(scrollTimer);
            scrollTimer = setTimeout(() => {
                rememberVisibleShelf();
                updateSearchPathFromTopShelf();
                void ensureScrollBuffer();
            }, 100);
        }, { passive: true });

        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                rememberVisibleShelf();
                void prefetchNextViewport();
                void ensureScrollBuffer();
            }, 300);
        });

        requestAnimationFrame(() => {
            void renderInitialShelves();
        });
    </script>
</body>
</html>
