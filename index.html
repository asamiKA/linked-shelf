<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookshelf Graph Navigator (Array Edges)</title>
    <link rel="stylesheet" href="./src/style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #15191b;
            color: #f0e6d2;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .scene {
            position: relative;
            width: 600px;
            height: 350px;
            background:
                radial-gradient(ellipse 2px 3px at 7px 18px, #30373a 0 1px, transparent 2px) left top / 15px 36px repeat-y,
                radial-gradient(ellipse 2px 3px at 7px 18px, #30373a 0 1px, transparent 2px) right top / 15px 36px repeat-y,
                linear-gradient(90deg, #737c80 0 15px, #353c40 15px 20px, transparent 20px calc(100% - 20px), #353c40 calc(100% - 20px) calc(100% - 15px), #737c80 calc(100% - 15px)),
                linear-gradient(180deg, #3d4549, #252b2e 75%, #1c2225);
            border: 4px solid #7b858a;
            border-radius: 4px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 0 0 2px #41494d;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
            box-sizing: border-box;
        }

        .shelf-title {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 14px;
            color: #d2d9db;
            letter-spacing: 1px;
            z-index: 2;
        }

        .overhead-light {
            position: absolute;
            top: 19px;
            left: 50%;
            width: 38px;
            height: 20px;
            transform: translateX(-50%);
            border: 2px solid #aeb7ba;
            border-radius: 50%;
            background: radial-gradient(ellipse, #fffef1 0 32%, #f5eecf 58%, #b8c0c1 78%);
            box-shadow: 0 0 8px 3px rgba(255, 248, 211, 0.75), 0 0 28px 12px rgba(255, 246, 203, 0.24);
            z-index: 1;
        }

        .overhead-light::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            width: 230px;
            height: 210px;
            transform: translateX(-50%);
            background: linear-gradient(rgba(255, 248, 218, 0.12), rgba(255, 248, 218, 0));
            clip-path: polygon(46% 0, 54% 0, 100% 100%, 0 100%);
            pointer-events: none;
        }

        /* 本棚の板 */
        .shelf-board {
            position: absolute;
            bottom: 40px;
            left: 20px;
            right: 20px;
            height: 18px;
            z-index: 2;
        }

        /* 背表紙コンテナ */
        .spine-container {
            display: flex;
            gap: 8px;
            align-items: flex-end;
            height: 220px;
            padding-bottom: 56px;
            z-index: 2;
            width: 100%;
            overflow-x: auto;
        }

        /* 背表紙のスタイル */
        .spine {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ナビゲーションボタン群（動的生成） */
        .nav-controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            width: 600px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: #3e2d22;
            color: #f0e6d2;
            border: 1px solid #5c4333;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        button:hover {
            background: #5c4333;
        }
    </style>
</head>
<body>

    <div class="scene">
        <div class="overhead-light" aria-hidden="true"></div>
        <div class="shelf-title" id="shelfTitle">現在の棚: 読み込み中...</div>
        
        <div class="spine-container" id="spineContainer">
            <!-- 背表紙がここに動的に生成されます -->
        </div>

        <div class="shelf-board"></div>
    </div>

    <!-- 動的にエッジ（選択肢）のボタンが並ぶエリア -->
    <div class="nav-controls" id="navControls"></div>

    <script type="module">
        import { fetchShelfBySru } from './src/api.js';

        // --- 1. モックデータベース（edgesがシンプルな配列に変更） ---
        const mockDatabase = {
            'node-1': {
                id: 'node-1',
                name: '物理学の棚 (A)',
                books: [
                    { title: '量子力学入門', color: '#191970' },
                    { title: '相対性理論概説', color: '#8b0000' },
                    { title: '統計力学の基礎', color: '#556b2f' }
                ],
                edges: [
                    { label: '◀ 左の棚へ', action: 'fetchShelfNode', args: { targetId: 'node-4' } },
                    { label: '右の棚へ ▶', action: 'fetchShelfNode', args: { targetId: 'node-2' } },
                    { label: '🚪 [奥の通路へワープ]', action: 'fetchShelfNode', args: { targetId: 'node-3' } } // 多様な接続の例
                ]
            },
            'node-2': {
                id: 'node-2',
                name: '宇宙・天文学の棚 (B)',
                books: [
                    { title: '宇宙論の現在', color: '#2f4f4f' },
                    { title: '恒星進化論', color: '#8b4513' },
                    { title: 'ブラックホール物理', color: '#483d8b' }
                ],
                edges: [
                    { label: '◀ 左の棚へ', action: 'fetchShelfNode', args: { targetId: 'node-1' } },
                    { label: '右の棚へ ▶', action: 'fetchShelfNode', args: { targetId: 'node-3' } }
                ]
            },
            'node-3': {
                id: 'node-3',
                name: '情報科学の棚 (C)',
                books: [
                    { title: 'アルゴリズムとデータ構造', color: '#006666' },
                    { title: '人工知能の歴史', color: '#663399' },
                    { title: '計算機アーキテクチャ', color: '#993333' }
                ],
                edges: [
                    { label: '◀ 左の棚へ', action: 'fetchShelfNode', args: { targetId: 'node-2' } },
                    { label: '右の棚へ ▶', action: 'fetchShelfNode', args: { targetId: 'node-4' } },
                    { label: '🔄 [振り返る]', action: 'fetchShelfNode', args: { targetId: 'node-1' } }
                ]
            },
            'node-4': {
                id: 'node-4',
                name: '数学の棚 (D)',
                books: [
                    { title: '線型代数特論', color: '#333366' },
                    { title: '位相空間論', color: '#663333' },
                    { title: '数理統計学入門', color: '#336633' }
                ],
                edges: [
                    { label: '◀ 左の棚へ', action: 'fetchShelfNode', args: { targetId: 'node-3' } },
                    { label: '右の棚へ ▶', action: 'fetchShelfNode', args: { targetId: 'node-1' } }
                ]
            }
        };

        // --- 2. アクション・レジストリ ---
        const actionRegistry = {
            fetchShelfNode: async (args) => {
                return new Promise(resolve => {
                    setTimeout(() => {
                        resolve(mockDatabase[args.targetId] || null);
                    }, 120);
                });
            },
            fetchSruShelf: async (args) => {
                const node = await fetchShelfBySru(args.searchParams);
                node.name = args.name;
                node.edges = args.edges || [];
                return node;
            }
        };

        let currentNode = null;

        // --- 3. レンダリング関数 ---
        function renderShelf(node) {
            currentNode = node;

            // 棚タイトルの更新
            document.getElementById('shelfTitle').textContent = `現在の棚: ${node.name} (${node.id})`;

            // 背表紙の生成
            const container = document.getElementById('spineContainer');
            container.innerHTML = '';

            node.books.forEach(book => {
                const spine = document.createElement('div');
                spine.className = 'spine book-spine';
                spine.style.setProperty('--book-color', book.color);
                spine.title = book.title;
                spine.onclick = () => alert(`「${book.title}」が選択されました`);
                const title = document.createElement('span');
                title.className = 'book-title';
                title.textContent = book.title;
                spine.appendChild(title);
                container.appendChild(spine);
            });

            // エッジ（配列）を元にナビゲーションボタンを動的生成
            const navControls = document.getElementById('navControls');
            navControls.innerHTML = '';

            node.edges.forEach(edge => {
                const btn = document.createElement('button');
                btn.textContent = edge.label;
                btn.onclick = () => triggerEdge(edge);
                navControls.appendChild(btn);
            });
        }

        // --- 4. エッジ実行のトリガー ---
        async function triggerEdge(edge) {
            const actionFn = actionRegistry[edge.action];
            if (actionFn) {
                const nextNode = await actionFn(edge.args);
                if (nextNode) {
                    renderShelf(nextNode);
                }
            }
        }

        // --- 初期起動 ---
        (async () => {
            const initialNode = await actionRegistry.fetchSruShelf({
                name: '物理学 (NDLC: MC21)',
                searchParams: { ndlc: 'MC21', cnt: 50 },
                edges: [
                    {
                        label: '次の50冊へ (51件目から)',
                        action: 'fetchSruShelf',
                        args: {
                            name: '物理学 (NDLC: MC21・51件目から)',
                            searchParams: { ndlc: 'MC21', cnt: 50, page: 2 }
                        }
                    },
                    {
                        label: 'MC71の棚へ (50冊)',
                        action: 'fetchSruShelf',
                        args: {
                            name: '物理学 (NDLC: MC71)',
                            searchParams: { ndlc: 'MC71', cnt: 50 }
                        }
                    }
                ]
            });
            renderShelf(initialNode);
        })();
    </script>
</body>
</html>
